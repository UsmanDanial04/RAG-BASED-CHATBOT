<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FaceAuth — Secure Login</title>
  <meta name="description" content="Login securely using face recognition powered by MediaPipe AI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #070b14;
      --bg-card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #6c63ff;
      --accent2: #00d4ff;
      --accent-glow: rgba(108,99,255,0.4);
      --success: #00e5a0;
      --warning: #ffb347;
      --danger: #ff5c7a;
      --text: #e8eaf6;
      --text-muted: #7b82a3;
      --radius: 20px;
      --radius-sm: 12px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Animated gradient background ── */
    .bg-gradient {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(108,99,255,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, rgba(0,212,255,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 60% 40%, rgba(0,229,160,0.06) 0%, transparent 50%),
        var(--bg-dark);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.15); }
    }

    /* ── Floating particles ── */
    .particles { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .particle {
      position: absolute; width: 2px; height: 2px;
      background: rgba(108,99,255,0.5); border-radius: 50%;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      from { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      to { transform: translateY(-10vh) translateX(30px); opacity: 0; }
    }

    /* ── Layout ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 40px;
      width: 100%;
      max-width: 520px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 32px 80px rgba(0,0,0,0.5),
        0 0 80px rgba(108,99,255,0.06);
      animation: cardIn 0.6s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 32px; }
    .logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 8px 32px var(--accent-glow);
      margin-bottom: 16px;
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 8px 32px var(--accent-glow); }
      50% { box-shadow: 0 8px 48px rgba(108,99,255,0.7), 0 0 80px rgba(0,212,255,0.2); }
    }
    .logo svg { width: 32px; height: 32px; }
    h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { color: var(--text-muted); font-size: 0.875rem; margin-top: 4px; }

    /* ── Input ── */
    .input-group {
      position: relative; margin-bottom: 24px;
    }
    .input-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .input-field {
      width: 100%; padding: 14px 16px 14px 46px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .input-field::placeholder { color: var(--text-muted); }
    .input-field:focus {
      border-color: var(--accent);
      background: rgba(108,99,255,0.07);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }

    /* ── Camera section ── */
    .camera-section { margin-bottom: 20px; }
    .camera-label {
      font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;
    }
    .camera-wrap {
      position: relative;
      width: 100%; aspect-ratio: 4/3;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #0a0f1e;
      border: 1px solid var(--border);
    }
    .camera-wrap::before {
      content: '';
      position: absolute; inset: 0; z-index: 3;
      border-radius: var(--radius-sm);
      background: linear-gradient(
        135deg,
        rgba(108,99,255,0.06) 0%,
        transparent 50%,
        rgba(0,212,255,0.04) 100%
      );
      pointer-events: none;
    }
    #video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror for natural selfie feel */
      border-radius: var(--radius-sm);
    }
    #overlay {
      position: absolute; inset: 0; z-index: 2;
      width: 100%; height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }

    /* Face guide circle */
    .face-guide {
      position: absolute; z-index: 1;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 55%; aspect-ratio: 1;
      border-radius: 50%;
      border: 2px dashed rgba(108,99,255,0.3);
      animation: guideRotate 12s linear infinite;
      pointer-events: none;
    }
    @keyframes guideRotate {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .face-guide::after {
      content: '';
      position: absolute; inset: -8px;
      border-radius: 50%;
      border: 1px dashed rgba(0,212,255,0.15);
      animation: guideRotate 8s linear infinite reverse;
    }

    /* Corner brackets */
    .corner { position: absolute; z-index: 4; width: 20px; height: 20px; pointer-events: none; }
    .corner.tl { top: 10px; left: 10px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); border-radius: 4px 0 0 0; }
    .corner.tr { top: 10px; right: 10px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); border-radius: 0 4px 0 0; }
    .corner.bl { bottom: 10px; left: 10px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); border-radius: 0 0 0 4px; }
    .corner.br { bottom: 10px; right: 10px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); border-radius: 0 0 4px 0; }

    /* Scan line animation */
    .scan-line {
      position: absolute; left: 0; right: 0; z-index: 3;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent2), transparent);
      box-shadow: 0 0 12px var(--accent2);
      animation: scanAnim 3s linear infinite;
      pointer-events: none;
      top: 0;
      opacity: 0;
    }
    .scan-line.active { opacity: 1; }
    @keyframes scanAnim {
      0% { top: 0%; }
      100% { top: 100%; }
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      margin-bottom: 20px;
      min-height: 44px;
      transition: border-color 0.3s, background 0.3s;
    }
    .status-bar.ok {
      border-color: rgba(0,229,160,0.35);
      background: rgba(0,229,160,0.07);
    }
    .status-bar.bad {
      border-color: rgba(255,92,122,0.35);
      background: rgba(255,92,122,0.07);
    }
    .status-bar.warn {
      border-color: rgba(255,179,71,0.35);
      background: rgba(255,179,71,0.07);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--text-muted);
      transition: background 0.3s;
    }
    .status-bar.ok .status-dot { background: var(--success); box-shadow: 0 0 8px var(--success); animation: dotPulse 1.5s ease-in-out infinite; }
    .status-bar.bad .status-dot { background: var(--danger); }
    .status-bar.warn .status-dot { background: var(--warning); }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status-text { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
    .status-bar.ok .status-text { color: var(--success); }
    .status-bar.bad .status-text { color: var(--danger); }
    .status-bar.warn .status-text { color: var(--warning); }

    /* ── Buttons ── */
    .btn {
      width: 100%; padding: 14px;
      border: none; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 1rem; font-weight: 600;
      cursor: pointer; outline: none;
      transition: all 0.2s cubic-bezier(.16,1,.3,1);
      position: relative; overflow: hidden;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 24px rgba(108,99,255,0.4);
    }
    .btn-primary::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #7c72ff, var(--accent2));
      opacity: 0; transition: opacity 0.2s;
    }
    .btn-primary:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(108,99,255,0.6);
    }
    .btn-primary:not(:disabled):hover::before { opacity: 1; }
    .btn-primary:not(:disabled):active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.4; cursor: not-allowed;
      box-shadow: none;
    }
    .btn-content { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }

    /* Loading spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer link ── */
    .footer-link {
      text-align: center; margin-top: 20px;
      font-size: 0.875rem; color: var(--text-muted);
    }
    .footer-link a {
      color: var(--accent2); text-decoration: none; font-weight: 500;
      transition: opacity 0.2s;
    }
    .footer-link a:hover { opacity: 0.8; }

    /* ── Loading overlay (loading mediapipe) ── */
    .loading-overlay {
      position: absolute; inset: 0; z-index: 10;
      background: #0a0f1e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      border-radius: var(--radius-sm);
      transition: opacity 0.5s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-ring {
      width: 40px; height: 40px;
      border: 3px solid rgba(108,99,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-overlay p { font-size: 0.8rem; color: var(--text-muted); }

    /* Toast notification */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: rgba(255,255,255,0.1); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50px; padding: 12px 24px;
      font-size: 0.875rem; font-weight: 500;
      color: var(--text);
      transition: transform 0.4s cubic-bezier(.16,1,.3,1), opacity 0.4s;
      opacity: 0; z-index: 100; white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.error { border-color: rgba(255,92,122,0.4); background: rgba(255,92,122,0.15); color: var(--danger); }
    .toast.success { border-color: rgba(0,229,160,0.4); background: rgba(0,229,160,0.12); color: var(--success); }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="particles" id="particles"></div>

  <div class="page">
    <div class="card">
      <!-- Header -->
      <div class="header">
        <div class="logo">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="12" r="5" stroke="white" stroke-width="2" fill="none"/>
            <path d="M5 28c0-6.075 4.925-11 11-11s11 4.925 11 11" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
            <path d="M10 6 L5 6 L5 11" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M22 6 L27 6 L27 11" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in with your face — no password needed</p>
      </div>

      <!-- Username input -->
      <div class="input-group">
        <span class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <input
          id="username"
          type="text"
          class="input-field"
          placeholder="Enter your username"
          autocomplete="username"
          spellcheck="false"
        />
      </div>

      <!-- Camera section -->
      <div class="camera-section">
        <p class="camera-label">Face Scan</p>
        <div class="camera-wrap" id="cameraWrap">
          <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-ring"></div>
            <p>Loading face detection…</p>
          </div>
          <div class="face-guide"></div>
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div class="scan-line" id="scanLine"></div>
          <video id="video" autoplay muted playsinline></video>
          <canvas id="overlay"></canvas>
        </div>
      </div>

      <!-- Status -->
      <div class="status-bar" id="statusBar">
        <div class="status-dot"></div>
        <span class="status-text" id="statusText">Initializing camera…</span>
      </div>

      <!-- Login button -->
      <button class="btn btn-primary" id="loginBtn" disabled>
        <span class="btn-content">
          <div class="spinner" id="spinner"></div>
          <span id="btnLabel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;margin-right:6px;">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Log In
          </span>
        </span>
      </button>

      <!-- Footer -->
      <div class="footer-link">
        Don't have an account? <a href="register.html" id="registerLink">Create one →</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <script>
    /* ── Config ── */
    const API_BASE = "http://localhost:5000";

    /* ── Particle generation ── */
    const particlesEl = document.getElementById("particles");
    for (let i = 0; i < 18; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = Math.random() * 100 + "%";
      p.style.animationDuration = (8 + Math.random() * 12) + "s";
      p.style.animationDelay = (Math.random() * 10) + "s";
      p.style.width = p.style.height = (1 + Math.random() * 2) + "px";
      p.style.opacity = Math.random() * 0.6 + 0.2;
      particlesEl.appendChild(p);
    }

    /* ── Elements ── */
    const video       = document.getElementById("video");
    const overlay     = document.getElementById("overlay");
    const ctx         = overlay.getContext("2d");
    const statusBar   = document.getElementById("statusBar");
    const statusText  = document.getElementById("statusText");
    const loginBtn    = document.getElementById("loginBtn");
    const spinner     = document.getElementById("spinner");
    const btnLabel    = document.getElementById("btnLabel");
    const scanLine    = document.getElementById("scanLine");
    const loadingOverlay = document.getElementById("loadingOverlay");

    let faceIsGood = false;
    let isLoggingIn = false;
    let autoLoginTimer = null;

    /* ── Status helper ── */
    function setStatus(msg, type = "neutral") {
      statusText.textContent = msg;
      statusBar.className = "status-bar " + type;
      scanLine.classList.toggle("active", type === "ok");
    }

    /* ── Toast helper ── */
    let toastTimer;
    function showToast(msg, type = "") {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = "toast show " + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.className = "toast"; }, 3500);
    }

    /* ── MediaPipe Face Detection ── */
    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`,
    });
    faceDetection.setOptions({ model: "short", minDetectionConfidence: 0.6 });

    faceDetection.onResults((results) => {
      // Sync canvas size to video
      if (overlay.width !== video.videoWidth || overlay.height !== video.videoHeight) {
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
      }
      ctx.clearRect(0, 0, overlay.width, overlay.height);

      if (!results.detections || results.detections.length === 0) {
        setStatus("No face detected — look at the camera", "bad");
        faceIsGood = false;
      } else if (results.detections.length > 1) {
        setStatus("Multiple faces detected — only one person", "warn");
        faceIsGood = false;
      } else {
        const box = results.detections[0].boundingBox;
        const fw = box.width  * overlay.width;
        const fh = box.height * overlay.height;
        const fx = box.xCenter * overlay.width  - fw / 2;
        const fy = box.yCenter * overlay.height - fh / 2;
        const areaRatio = box.width * box.height;

        faceIsGood = areaRatio > 0.05;

        // Draw glowing bounding box
        const color = faceIsGood ? "#00e5a0" : "#ffb347";
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        roundRect(ctx, fx, fy, fw, fh, 10);
        ctx.restore();

        // Key-point dots (eyes, nose, mouth, ears)
        if (results.detections[0].landmarks) {
          ctx.save();
          results.detections[0].landmarks.forEach(lm => {
            const lx = lm.x * overlay.width;
            const ly = lm.y * overlay.height;
            ctx.beginPath();
            ctx.arc(lx, ly, 3, 0, Math.PI * 2);
            ctx.fillStyle = faceIsGood ? "rgba(0,229,160,0.8)" : "rgba(255,179,71,0.8)";
            ctx.shadowColor = color;
            ctx.shadowBlur = 6;
            ctx.fill();
          });
          ctx.restore();
        }

        setStatus(
          faceIsGood ? "Face verified ✓" : "Move closer to the camera",
          faceIsGood ? "ok" : "warn"
        );
      }

      loginBtn.disabled = !faceIsGood;

      // Auto-login logic
      const usernameVal = document.getElementById("username").value.trim();
      if (faceIsGood && usernameVal && !isLoggingIn) {
        if (!autoLoginTimer) {
          setStatus("Auto-authenticating...", "ok");
          autoLoginTimer = setTimeout(() => {
            if (faceIsGood && !isLoggingIn) {
              loginBtn.click();
            }
          }, 1500); // 1.5 second delay before auto-login
        }
      } else {
        if (autoLoginTimer) {
          clearTimeout(autoLoginTimer);
          autoLoginTimer = null;
        }
      }
    });

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.stroke();
    }

    /* ── Camera ── */
    const camera = new Camera(video, {
      onFrame: async () => { await faceDetection.send({ image: video }); },
      width: 640, height: 480,
    });
    camera.start().then(() => {
      loadingOverlay.classList.add("hidden");
      setStatus("Position your face in the frame", "neutral");
    }).catch(err => {
      setStatus("Camera access denied — please allow camera", "bad");
      loadingOverlay.classList.add("hidden");
      console.error(err);
    });

    /* ── Login submit ── */
    loginBtn.addEventListener("click", async () => {
      if (isLoggingIn) return;
      
      const username = document.getElementById("username").value.trim();
      if (!username) {
        showToast("Please enter your username first", "error");
        document.getElementById("username").focus();
        return;
      }

      // Capture current frame
      const tmpCanvas = document.createElement("canvas");
      tmpCanvas.width  = video.videoWidth;
      tmpCanvas.height = video.videoHeight;
      // Draw un-mirrored (CSS mirror is only visual)
      const tmpCtx = tmpCanvas.getContext("2d");
      tmpCtx.save();
      tmpCtx.scale(-1, 1);
      tmpCtx.drawImage(video, -tmpCanvas.width, 0);
      tmpCtx.restore();
      const dataUrl = tmpCanvas.toDataURL("image/jpeg", 0.9);

      // UI: loading state
      isLoggingIn = true;
      loginBtn.disabled = true;
      spinner.style.display = "block";
      btnLabel.style.display = "none";
      setStatus("Verifying your identity…", "warn");

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ username, image: dataUrl }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Login failed");

        setStatus("Authentication successful! Redirecting…", "ok");
        showToast("Welcome back, " + data.username + "! 🎉", "success");
        setTimeout(() => { window.location.href = "chatbot.html"; }, 1000);
      } catch (err) {
        showToast(err.message, "error");
        setStatus("Authentication failed — try again", "bad");
        isLoggingIn = false;
        loginBtn.disabled = false;
        spinner.style.display = "none";
        btnLabel.style.display = "inline";
      }
    });
  </script>
</body>
</html>
