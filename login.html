<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Gemini Echo</title>
    <meta name="description" content="Sign in to Gemini Echo, your RAG-powered AI chatbot powered by Google Gemini." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      :root{
        --bg-deep:#06070f;--bg-card:rgba(14,16,32,0.85);
        --border:rgba(255,255,255,0.08);--border-focus:rgba(139,92,246,0.7);
        --text-primary:#f0f0ff;--text-muted:rgba(200,200,230,0.55);
        --accent-1:#7c3aed;--accent-2:#a855f7;--accent-3:#06b6d4;
        --gradient-btn:linear-gradient(135deg,#7c3aed 0%,#a855f7 50%,#06b6d4 100%);
        --error:#f87171;--success:#34d399;
        --shadow-glow:0 0 60px rgba(124,58,237,0.25);
        --radius-card:24px;--radius-input:14px;
        --font-main:'Inter',sans-serif;--font-brand:'Outfit',sans-serif;
        --transition:all 0.3s cubic-bezier(0.4,0,0.2,1)
      }
      html,body{height:100%;font-family:var(--font-main);background:var(--bg-deep);color:var(--text-primary);overflow:hidden}
      .bg-canvas{position:fixed;inset:0;z-index:0;overflow:hidden}
      .bg-canvas::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(124,58,237,0.18) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 80%,rgba(6,182,212,0.14) 0%,transparent 55%),radial-gradient(ellipse 50% 70% at 60% 30%,rgba(168,85,247,0.10) 0%,transparent 50%)}
      .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:0.5;animation:orb-float 12s ease-in-out infinite}
      .orb-1{width:400px;height:400px;background:radial-gradient(circle,rgba(124,58,237,0.5),transparent 70%);top:-100px;left:-80px;animation-duration:14s}
      .orb-2{width:350px;height:350px;background:radial-gradient(circle,rgba(6,182,212,0.45),transparent 70%);bottom:-80px;right:-60px;animation-duration:10s;animation-delay:-4s}
      .orb-3{width:250px;height:250px;background:radial-gradient(circle,rgba(168,85,247,0.4),transparent 70%);top:50%;right:10%;animation-duration:16s;animation-delay:-8s}
      @keyframes orb-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
      .bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:60px 60px}
      .particle{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(168,85,247,0.6);animation:particle-drift linear infinite}
      @keyframes particle-drift{0%{transform:translateY(100vh) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) translateX(40px);opacity:0}}
      .page{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
      .login-card{width:100%;max-width:440px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-card);padding:48px 44px;backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:var(--shadow-glow),0 2px 0 rgba(255,255,255,0.06) inset,0 40px 80px rgba(0,0,0,0.6);animation:card-enter 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;opacity:0;transform:translateY(30px) scale(0.97)}
      @keyframes card-enter{to{opacity:1;transform:translateY(0) scale(1)}}
      .brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:40px}
      .brand-logo-wrap{position:relative;width:64px;height:64px}
      .brand-logo-bg{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(124,58,237,0.45);animation:logo-pulse 3s ease-in-out infinite}
      .brand-logo-bg svg{width:30px;height:30px;color:#fff}
      .brand-ring{position:absolute;inset:-5px;border-radius:22px;border:1.5px solid rgba(124,58,237,0.4);animation:ring-spin 8s linear infinite}
      .brand-ring::after{content:'';position:absolute;width:8px;height:8px;background:var(--accent-3);border-radius:50%;top:-4px;left:50%;transform:translateX(-50%);box-shadow:0 0 10px var(--accent-3)}
      @keyframes logo-pulse{0%,100%{box-shadow:0 8px 32px rgba(124,58,237,0.45)}50%{box-shadow:0 8px 48px rgba(124,58,237,0.75),0 0 20px rgba(168,85,247,0.3)}}
      @keyframes ring-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      .brand-name{font-family:var(--font-brand);font-size:26px;font-weight:700;letter-spacing:-0.4px;background:linear-gradient(135deg,#e0d7ff 0%,#c4b5fd 50%,#67e8f9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
      .brand-tagline{font-size:13px;color:var(--text-muted);letter-spacing:0.2px;text-align:center}
      .login-heading{margin-bottom:28px;text-align:center}
      .login-heading h1{font-family:var(--font-brand);font-size:22px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
      .login-heading p{font-size:13.5px;color:var(--text-muted)}
      .login-form{display:flex;flex-direction:column;gap:20px}
      .field-group{display:flex;flex-direction:column;gap:8px}
      .field-label{font-size:13px;font-weight:500;color:rgba(220,215,255,0.85);letter-spacing:0.2px}
      .input-wrap{position:relative;display:flex;align-items:center}
      .input-icon{position:absolute;left:16px;color:var(--text-muted);display:flex;align-items:center;pointer-events:none;transition:var(--transition);z-index:1}
      .input-icon svg{width:17px;height:17px}
      .field-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-input);padding:14px 48px 14px 46px;font-family:var(--font-main);font-size:14px;color:var(--text-primary);outline:none;transition:var(--transition)}
      .field-input::placeholder{color:rgba(180,175,215,0.35)}
      .field-input:hover{border-color:rgba(255,255,255,0.15);background:rgba(255,255,255,0.06)}
      .field-input:focus{border-color:var(--border-focus);background:rgba(124,58,237,0.06);box-shadow:0 0 0 3px rgba(124,58,237,0.15),0 0 20px rgba(124,58,237,0.1)}
      .input-wrap:focus-within .input-icon{color:var(--accent-2)}
      .toggle-pw{position:absolute;right:14px;background:none;border:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;padding:4px;border-radius:6px;transition:var(--transition)}
      .toggle-pw svg{width:16px;height:16px}
      .toggle-pw:hover{color:var(--accent-2);background:rgba(168,85,247,0.1)}
      .field-meta{display:flex;justify-content:flex-end;margin-top:-4px}
      .forgot-link{font-size:12.5px;color:var(--accent-2);text-decoration:none;transition:var(--transition);opacity:0.85}
      .forgot-link:hover{opacity:1;text-decoration:underline}
      .error-msg{display:none;align-items:center;gap:8px;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--error)}
      .error-msg.visible{display:flex;animation:shake 0.4s cubic-bezier(0.36,0.07,0.19,0.97)}
      .error-msg svg{flex-shrink:0;width:15px;height:15px}
      @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
      .submit-btn{position:relative;width:100%;padding:15px;border:none;border-radius:var(--radius-input);background:var(--gradient-btn);font-family:var(--font-brand);font-size:15px;font-weight:600;color:#fff;cursor:pointer;letter-spacing:0.3px;overflow:hidden;transition:var(--transition);box-shadow:0 4px 24px rgba(124,58,237,0.45);margin-top:4px}
      .submit-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);opacity:0;transition:var(--transition)}
      .submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 36px rgba(124,58,237,0.6)}
      .submit-btn:hover::before{opacity:1}
      .submit-btn:active{transform:translateY(0)}
      .submit-btn:disabled{opacity:0.65;cursor:not-allowed;transform:none}
      .btn-content{display:flex;align-items:center;justify-content:center;gap:8px;transition:var(--transition)}
      .btn-content svg{width:17px;height:17px}
      .btn-spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;margin:auto}
      @keyframes spin{to{transform:rotate(360deg)}}
      .submit-btn.loading .btn-content{display:none}
      .submit-btn.loading .btn-spinner{display:block}
      .submit-btn.loading{display:flex;align-items:center;justify-content:center}
      .divider{display:flex;align-items:center;gap:14px;color:var(--text-muted);font-size:12px}
      .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
      .signup-footer{text-align:center;font-size:13px;color:var(--text-muted);margin-top:4px}
      .signup-footer a{color:var(--accent-2);text-decoration:none;font-weight:500;transition:var(--transition)}
      .signup-footer a:hover{color:var(--accent-3)}
      .success-overlay{display:none;flex-direction:column;align-items:center;gap:16px;text-align:center}
      .success-overlay.visible{display:flex}
      .login-form.hidden,.login-heading.hidden{display:none}
      .success-icon-wrap{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,rgba(52,211,153,0.2),rgba(6,182,212,0.2));border:1px solid rgba(52,211,153,0.4);display:flex;align-items:center;justify-content:center;animation:success-pop 0.5s cubic-bezier(0.34,1.56,0.64,1)}
      .success-icon-wrap svg{width:34px;height:34px;color:var(--success)}
      @keyframes success-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
      .success-title{font-family:var(--font-brand);font-size:20px;font-weight:700;color:var(--text-primary)}
      .success-subtitle{font-size:13.5px;color:var(--text-muted)}
      .redirect-bar{width:100%;height:3px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;margin-top:8px}
      .redirect-bar-fill{height:100%;background:var(--gradient-btn);border-radius:99px;animation:fill-bar 2s linear forwards}
      @keyframes fill-bar{from{width:0%}to{width:100%}}
      @media(max-width:500px){.login-card{padding:36px 24px}.brand-name{font-size:22px}}
      ::-webkit-scrollbar{width:6px}
      ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.4);border-radius:99px}
    </style>
  </head>
  <body>
    <div class="bg-canvas">
      <div class="bg-grid"></div>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <div class="page">
      <div class="login-card" role="main">

        <div class="brand">
          <div class="brand-logo-wrap">
            <div class="brand-logo-bg">
              <i data-lucide="sparkles"></i>
            </div>
            <div class="brand-ring"></div>
          </div>
          <div>
            <div class="brand-name">Gemini Echo</div>
            <div class="brand-tagline">RAG-Powered AI Chatbot</div>
          </div>
        </div>

        <div class="login-heading" id="login-heading">
          <h1>Welcome back</h1>
          <p>Sign in to your account to continue</p>
        </div>

        <div class="error-msg" id="error-msg" role="alert">
          <i data-lucide="alert-circle"></i>
          <span id="error-text">Invalid email or password.</span>
        </div>

        <form class="login-form" id="login-form" novalidate>

          <div class="field-group">
            <label class="field-label" for="email-input">Email address</label>
            <div class="input-wrap">
              <span class="input-icon"><i data-lucide="mail"></i></span>
              <input type="email" id="email-input" class="field-input" placeholder="you@example.com" autocomplete="email" required />
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="password-input">Password</label>
            <div class="input-wrap">
              <span class="input-icon"><i data-lucide="lock"></i></span>
              <input type="password" id="password-input" class="field-input" placeholder="Enter your password" autocomplete="current-password" required />
              <button type="button" class="toggle-pw" id="toggle-pw" title="Show / hide password" aria-label="Toggle password visibility">
                <i data-lucide="eye" id="pw-eye-icon"></i>
              </button>
            </div>
            <div class="field-meta">
              <a href="#" class="forgot-link" id="forgot-link">Forgot password?</a>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">
            <div class="btn-content">
              <i data-lucide="log-in"></i>
              <span>Sign In</span>
            </div>
            <div class="btn-spinner"></div>
          </button>

          <div class="divider">or</div>

          <div class="signup-footer">
            Don't have an account? <a href="#" id="signup-link">Create one</a>
          </div>

        </form>

        <div class="success-overlay" id="success-overlay">
          <div class="success-icon-wrap">
            <i data-lucide="check-circle-2"></i>
          </div>
          <div class="success-title">You're in! 🎉</div>
          <div class="success-subtitle">Redirecting to your workspace…</div>
          <div class="redirect-bar">
            <div class="redirect-bar-fill"></div>
          </div>
        </div>

      </div>
    </div>

    <script>
      lucide.createIcons();

      // Particles
      (function() {
        var canvas = document.querySelector('.bg-canvas');
        for (var i = 0; i < 18; i++) {
          var p = document.createElement('div');
          p.className = 'particle';
          p.style.left = (Math.random() * 100) + 'vw';
          p.style.animationDuration = (14 + Math.random() * 20) + 's';
          p.style.animationDelay = (Math.random() * 20) + 's';
          p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
          var hue = Math.random() > 0.5 ? '270' : '190';
          p.style.background = 'hsl(' + hue + ',80%,70%)';
          canvas.appendChild(p);
        }
      })();

      var form        = document.getElementById('login-form');
      var emailInput  = document.getElementById('email-input');
      var pwInput     = document.getElementById('password-input');
      var togglePwBtn = document.getElementById('toggle-pw');
      var submitBtn   = document.getElementById('submit-btn');
      var errorMsg    = document.getElementById('error-msg');
      var errorText   = document.getElementById('error-text');
      var successDiv  = document.getElementById('success-overlay');
      var loginHeading= document.getElementById('login-heading');
      var forgotLink  = document.getElementById('forgot-link');
      var signupLink  = document.getElementById('signup-link');

      // Password visibility toggle
      var pwVisible = false;
      togglePwBtn.addEventListener('click', function() {
        pwVisible = !pwVisible;
        pwInput.type = pwVisible ? 'text' : 'password';
        togglePwBtn.innerHTML = pwVisible
          ? '<i data-lucide="eye-off"></i>'
          : '<i data-lucide="eye"></i>';
        lucide.createIcons();
      });

      // Clear error on retype
      [emailInput, pwInput].forEach(function(el) {
        el.addEventListener('input', function() {
          errorMsg.classList.remove('visible');
        });
      });

      function showError(msg) {
        errorText.textContent = msg;
        // re-trigger animation
        errorMsg.classList.remove('visible');
        void errorMsg.offsetWidth;
        errorMsg.classList.add('visible');
      }

      function isValidEmail(v) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = emailInput.value.trim();
        var password = pwInput.value;

        if (!email) { showError('Please enter your email address.'); emailInput.focus(); return; }
        if (!isValidEmail(email)) { showError('Please enter a valid email address.'); emailInput.focus(); return; }
        if (!password) { showError('Please enter your password.'); pwInput.focus(); return; }
        if (password.length < 6) { showError('Password must be at least 6 characters.'); pwInput.focus(); return; }

        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
        errorMsg.classList.remove('visible');

        // Simulated async login (demo credentials: demo@geminiecho.ai / demo123)
        setTimeout(function() {
          var DEMO_EMAIL = 'demo@geminiecho.ai';
          var DEMO_PASSWORD = 'demo123';
          if (email.toLowerCase() === DEMO_EMAIL && password === DEMO_PASSWORD) {
            sessionStorage.setItem('ge_logged_in', '1');
            sessionStorage.setItem('ge_user_email', email);
            showSuccess();
          } else {
            showError('Incorrect email or password. Please try again.');
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
          }
        }, 1600);
      });

      function showSuccess() {
        form.classList.add('hidden');
        loginHeading.classList.add('hidden');
        errorMsg.classList.remove('visible');
        successDiv.classList.add('visible');
        lucide.createIcons();
        setTimeout(function() { window.location.href = '/'; }, 2200);
      }

      forgotLink.addEventListener('click', function(e) {
        e.preventDefault();
        showError("Password reset: enter your email and we'll send a link.");
        emailInput.focus();
      });

      signupLink.addEventListener('click', function(e) {
        e.preventDefault();
        showError('Registration coming soon. Use demo@geminiecho.ai / demo123 to explore.');
      });

      if (sessionStorage.getItem('ge_logged_in') === '1') {
        window.location.href = '/';
      }
    </script>
  </body>
</html>
